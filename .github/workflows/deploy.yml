name: Validate hosted application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:backend
      - run: npm run build
        working-directory: frontend
      - name: Report dependency advisories
        run: npm audit --omit=dev
        continue-on-error: true
      # Vercel's Git integration builds the same root vercel.json. No legacy
      # Render services or databases are mutated by this workflow.
